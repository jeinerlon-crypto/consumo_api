<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>ClimApp</title>
</head>
<body>
    <div class="contenedor">
        <h1>Clima por ciudades</h1>

        <div class="busqueda">
            <input type="text" class="input-ciudad" placeholder="Ingrese una ciudad">
            <button class="btn-buscar">Buscar</button>
        </div>

        <div class="resultado">
            <h2>Ciudad:</h2>
            <p>Temperatura:</p>
            <p>Humedad:</p>
            <p>Descripción:</p>
            <p>País:</p>
        </div>
    </div>

    <script src="clima.js"></script>
</body>
</html>
