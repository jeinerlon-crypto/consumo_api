<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="pokedex-container">
        <h1>
            <a href="index.html">
                <img src="/ejercicio 3/img/logo.png" alt="Pokédex" class="pokedex-logo" />
            </a>
        </h1>

    <!-- Formulario de búsqueda -->
    <form id="search-form" class="search-box">
      <input 
        type="text" 
        id="pokemon-input" 
        placeholder="Escribe el nombre o número..." 
        list="pokemon-suggestions"
        autocomplete="off"
        required
      />
      <!-- Lista para sugerencias dinámicas -->
      <datalist id="pokemon-suggestions"></datalist>

      <button type="submit">Buscar</button>
    </form>

    <!-- Contenedor donde se insertará la tarjeta del Pokémon -->
    <div id="pokemon-card-container">
      <p class="placeholder-text">Ingresa un nombre o ID para buscar un Pokémon.</p>
    </div>
  </main>
    <script src="pokedex.js"></script>
</body>
</html>
